name: CI / Production Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  repo-integrity-and-security:
    name: 🛡️ Config Integrity & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv pip install --system pyyaml pydantic pytest pytest-asyncio typer rich httpx

      - name: Pre-Commit Secret Scanner Audit
        run: |
          python .agents/secret_scan.py .

      - name: Validate All JSON & YAML Configurations
        run: |
          pytest tests/test_config_integrity.py

  python-test-suite:
    name: 🐍 Python Unit & Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies via uv
        run: |
          uv pip install --system pytest pytest-asyncio pydantic typer rich pyyaml httpx

      - name: Run Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v -o asyncio_mode=auto

  templates-verification:
    name: 📦 Full-Stack & Mobile Template Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Full-Stack App Build
        working-directory: templates/fullstack-agent-app
        run: |
          test -f "app/chat/page.tsx" || exit 1
          test -f ".env.example" || exit 1
          test -f "app/api/chat/route.ts" || exit 1
          npm ci
          npm run build
          echo "✓ Fullstack template built cleanly with zero route errors."

      - name: Verify Mobile App Structure & Config
        working-directory: templates/mobile-agent-app
        run: |
          test -f "package.json" || exit 1
          test -f ".maestro/flows/chat.yaml" || exit 1
          test -f "app/(tabs)/chat.tsx" || exit 1
          test -f "app/(tabs)/index.tsx" || exit 1
          echo "✓ All mobile template routes and Maestro flows verified."

      - name: Verify Monorepo SaaS Structure & Config
        working-directory: templates/monorepo-saas
        run: |
          test -f "turbo.json" || exit 1
          test -f "pnpm-workspace.yaml" || exit 1
          test -f "apps/web/package.json" || exit 1
          test -f "apps/mobile/package.json" || exit 1
          test -f "packages/ui/package.json" || exit 1
          test -f "packages/database/schema.prisma" || exit 1
          echo "✓ Monorepo SaaS template structure verified."

  supply-chain-security:
    name: 🔒 Supply Chain & SBOM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify CycloneDX SBOM Generation
        working-directory: templates/fullstack-agent-app
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file ../../sbom.json
          test -s ../../sbom.json || exit 1
          echo "✓ CycloneDX SBOM successfully generated."

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.json
