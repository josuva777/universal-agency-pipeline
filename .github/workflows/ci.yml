name: CI / Production Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  repo-integrity-and-security:
    name: 🛡️ Config Integrity & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic pytest pytest-asyncio typer rich httpx

      - name: Pre-Commit Secret Scanner Audit
        run: |
          python .agents/secret_scan.py .

      - name: Validate All JSON & YAML Configurations
        run: |
          python -m pytest tests/test_config_integrity.py -v

  python-test-suite:
    name: 🐍 Python Unit & Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pydantic typer rich pyyaml httpx

      - name: Run Full Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v -o asyncio_mode=auto

  templates-verification:
    name: 📦 Full-Stack & Mobile Template Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Full-Stack App Build
        working-directory: templates/fullstack-agent-app
        run: |
          test -f "app/chat/page.tsx" || exit 1
          test -f ".env.example" || exit 1
          test -f "app/api/chat/route.ts" || exit 1
          npm ci
          npm run build
          echo "✓ Fullstack template built cleanly with zero route errors."

      - name: Verify Mobile App Structure & Config
        working-directory: templates/mobile-agent-app
        run: |
          node -e "
            const fs = require('fs');
            const required = ['package.json', '.maestro/flows/chat.yaml', 'app/(tabs)/chat.tsx', 'app/(tabs)/index.tsx'];
            for (const f of required) {
              if (!fs.existsSync(f)) {
                console.error('Missing required mobile file: ' + f);
                process.exit(1);
              }
            }
            console.log('✓ All mobile template routes and Maestro flows verified.');
          "

      - name: Verify Monorepo SaaS Structure & Config
        working-directory: templates/monorepo-saas
        run: |
          node -e "
            const fs = require('fs');
            const required = ['turbo.json', 'pnpm-workspace.yaml', 'apps/web/package.json', 'apps/mobile/package.json', 'packages/ui/package.json', 'packages/api/src/tracing.ts', 'packages/database/schema.prisma'];
            for (const f of required) {
              if (!fs.existsSync(f)) {
                console.error('Missing required monorepo file: ' + f);
                process.exit(1);
              }
            }
            console.log('✓ Monorepo SaaS template structure verified.');
          "

  lighthouse-and-eval-check:
    name: ⚡ Lighthouse CI & Promptfoo Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          python -m pip install pyyaml pydantic pytest pytest-asyncio typer rich httpx

      - name: Verify Promptfoo Evaluation Target
        run: |
          python -m pytest tests/test_config_integrity.py -k "test_promptfoo_configuration or test_lighthouse_configuration" -v

      - name: Verify Lighthouse Configuration Security
        run: |
          node -e "
            const c = require('./lighthouserc.js');
            if (c.ci.upload.target !== 'filesystem') {
              console.error('Security Gate Failed: Lighthouse must not use public upload storage!');
              process.exit(1);
            }
            console.log('✓ Lighthouse configuration verified with secure filesystem output.');
          "

  supply-chain-security:
    name: 🔒 Supply Chain & SBOM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify CycloneDX SBOM Generation
        working-directory: templates/fullstack-agent-app
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-format JSON --output-file ../../sbom.json
          test -s ../../sbom.json || exit 1
          echo "✓ CycloneDX SBOM successfully generated."

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.json
