[project]
name = "creative-agent-studio"
version = "0.1.0"
description = "Broadcast-grade AI-powered creative production studio - 4K video, 3D VFX, audio mastering, vector logos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "edge-tts>=7.0.0",
    "faster-whisper>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.3.0", "soundfile>=0.12.0", "numpy>=1.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
